<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A short, playable prototype for splitting household expenses." />
    <meta name="theme-color" content="#14213d" />

    <link rel="stylesheet" href="styles.css" />
